<svg xmlns="http://www.w3.org/2000/svg" width="920" height="286" viewBox="0 0 920 286" role="img" aria-labelledby="t d" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace"><title id="t">Build pipeline and its security controls</title><desc id="d">Five-stage pipeline that regenerates this profile. TRIGGER: schedule + manual only, no fork-PR triggers, concurrency guarded; FETCH: api.github.com only, redirects refused, timeout + size ceiling; VALIDATE: schema-checked config, unknown keys rejected, URL host allow-list; RENDER: escaped at every sink, no eval / no shell, deterministic output; PUBLISH: contents:write, 1 job, diff-gated commit, no secret in artefact. Controls in force: 0 third-party runtime deps, 0 third-party actions, default permissions: {}, GITHUB_TOKEN only, no PAT, reproducible byte-for-byte, output audited before publis…</desc><rect x="0" y="0" width="920" height="286" rx="12" fill="#0A0E14" stroke="#212A36" stroke-width="1"/><text x="24" y="30" font-size="10" fill="#8695A8" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-weight="600" letter-spacing="1.8">SUPPLY CHAIN</text><text x="896" y="30" font-size="9.5" fill="#5A6675" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" text-anchor="end">stdlib python · zero runtime dependencies</text><text x="24" y="46" font-size="9.5" fill="#5A6675" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">how this page rebuilds itself, and what stops it becoming a foothold</text><rect x="24" y="58" width="163.2" height="116" rx="9" fill="#10151D" stroke="#212A36" stroke-width="1"/><rect x="24" y="58" width="163.2" height="2.5" rx="1.25" fill="#22C55E"/><text x="175.2" y="82" font-size="9.5" fill="#5A6675" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,C