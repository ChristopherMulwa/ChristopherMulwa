<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="t d" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace"><title id="t">Christopher Mulwa: I build systems that move money, then try to break them.</title><desc id="d">Banner for Christopher Mulwa. Software engineer · application security, Full stack and mobile, threat modelling and pentesting, Currently the only engineer on a client platform under NDA, Ships with AI coding agents, under rules, In security since 2019, BSc Information Security and Forensics, Founder, Devsirch Hub: we build it, we secure it. Based in Nairobi, Kenya. 4 public repositories, 3483 contributions in the last 12 months, 99% of them in private repositories. The dial plots 4 public repositories by how recently each was pushed: recent work near the centre, dormant work toward the rim (…</desc><defs><pattern id="grid-light" width="23" height="23" patternUnits="userSpaceOnUse"><path d="M 23 0 L 0 0 0 23" fill="none" stroke="#E7ECF2" stroke-width="1"/></pattern><linearGradient id="fade-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="sweep-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15803D" stop-opacity="0.34"/><stop offset="1" stop-color="#15803D" stop-opacity="0"/></linearGradient><linearGradient id="rule-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15803D"/><stop offset="1" stop-color="#15803D" stop-opacity="0"/></linearGradient></defs><style>/*<![CDATA[*/
.role{opacity:0;animation:roll 20.4s linear infinite}
/* The ticker must never be the only way to read a role. Where the animation
   does not run, every .role stays at opacity 0 and the line renders blank --
   which is what happens on the profile page itself, because GitHub embeds
   this file with <img> and the animation does not start there. The first
   role therefore carries an explicit class that sets it visible. (An earlier
   version used .role:first-of-type, which silently matched the backdrop
   group that precedes the roles, so the fallback never applied.) Keeping the
   first role visible by default costs nothing where the animation does run:
   an infinite animation is always in its active phase, so the animated value
   wins and role one still takes its turn in the cycle.
   Measured in Chrome: inside <img> the animation is applied but frozen at
   time zero, so the 0% keyframe is what renders, and a 0% keyframe of
   opacity 0 blanks the line regardless of the base rule. The first role
   therefore runs its own keyframes that begin visible. */
.role-static{opacity:1;animation-name:roll-first}
@keyframes roll{
0%{opacity:0;transform:translateY(5px)}
0.83%{opacity:1;transform:translateY(0)}
15.83%{opacity:1;transform:translateY(0)}
16.67%{opacity:0;transform:translateY(-5px)}
100%{opacity:0}}
@keyframes roll-first{
0%{opacity:1;transform:translateY(0)}
15.83%{opacity:1;transform:translateY(0)}
16.67%{opacity:0;transform:translateY(-5px)}
100%{opacity:0}}
.sweep{animation:spin 5.5s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ping{animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.ping-ring{animation:expand 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes expand{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(3.4);opacity:0}}
.beam{animation:scan 7s ease-in-out infinite}
@keyframes scan{0%,100%{opacity:0}45%{opacity:.5}55%{opacity:.5}}
@media (prefers-reduced-motion:reduce){
.role,.sweep,.ping,.ping-ring,.beam{animation:none}
.role-static{opacity:1}}
/*]]>*/</style><rect x="0" y="0" width="920" height="250" fill="#FFFFFF"/><rect x="0" y="0" width="920" height="250" fill="url(#grid-light)"/><circle cx="772" cy="145" r="96" fill="none" stroke="#D5DDE6" stroke-width="1" opacity="0.90"/><circle cx="772" cy="145" r="69.12" fill="none" stroke="#D5DDE6" stroke-width="1" opacity="0.74"/><circle cx="772" cy="145" r="44.16" fill="none" stroke="#D5DDE6" stroke-width="1" opacity="0.58"/><circle cx="772" cy="145" r="21.12" fill="none" stroke="#D5DDE6" stroke-width="1" opacity="0.42"/><line x1="676" y1="145" x2="868" y2="145" stroke="#D5DDE6" stroke-width="1" opacity="0.5"/><line x1="772" y1="49" x2="772" y2="241" stroke="#D5DDE6" stroke-width="1" opacity="0.5"/><circle cx="807.3" cy="157.8" r="3" fill="#15803D" class="ping" style="animation-delay:0.0s"><title>ChristopherMulwa</title></circle><circle cx="807.3" cy="157.8" r="5" fill="none" stroke="#15803D" stroke-width="1" opacity="0.55" class="ping-ring" style="animation-delay:0.0s"/><circle cx="859.5" cy="157.3" r="3" fill="#0E7490" class="ping" style="animation-delay:0.9s"><title>Team-DEVSIRCH-CHAI</title></circle><circle cx="859.5" cy="157.3" r="5" fill="none" stroke="#0E7490" stroke-width="1" opacity="0.55" class="ping-ring" style="animation-delay:0.9s"/><circle cx="708.5" cy="83.6" r="3" fill="#6D28D9" class="ping" style="animation-delay:1.8s"><title>Bash_Scripts</title></circle><circle cx="708.5" cy="83.6" r="5" fill="none" stroke="#6D28D9" stroke-width="1" opacity="0.55" class="ping-ring" style="animation-delay:1.8s"/><circle cx="694.8" cy="102.2" r="3" fill="#B45309" class="ping" style="animation-delay:2.7s"><title>C_Scripts</title></circle><circle cx="694.8" cy="102.2" r="5" fill="none" stroke="#B45309" stroke-width="1" opacity="0.55" class="ping-ring" style="animation-delay:2.7s"/><path d="M 772 145 L 868 145 A 96 96 0 0 0 831.1 69.4 Z" fill="url(#sweep-light)" class="sweep" style="transform-origin:772px 145px"/><circle cx="772" cy="145" r="2.5" fill="#15803D"/><re